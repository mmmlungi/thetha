{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username <input name="username" maxlength="32" required autocomplete="off"></label>
    <label>Password <input name="password" type="password" maxlength="128" required></label>
    <button type="submit">Log in</button>
  </form>
  <p>No account? <a href="{{ url_for('main.register') }}">Create a private one</a>. Use a nickname, not your real name.</p>
</section>
{% endblock %}
